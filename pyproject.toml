[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drews-xcode-mcp"
dynamic = ["version"]
description = "Drew's MCP server for Xcode integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Andrew Benson", email = "db@nuclearcyborg.com"},
]
keywords = ["mcp", "xcode", "server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # mcp 2.0.0 removed mcp.server.fastmcp; stay on 1.x until we migrate to the v2 API.
    # Floored at 1.29.0 deliberately: that is the 1.x release we develop and test
    # against, so users get the same SDK behavior we see.
    "mcp[cli]>=1.29.0,<2.0.0",
    "questionary>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
drews-xcode-mcp = "drews_xcode_mcp:main"

[tool.hatch.build.targets.sdist]
only-include = ["drews_xcode_mcp"]

[tool.hatch.version]
path = "drews_xcode_mcp/__init__.py"

[tool.uv]
dev-dependencies = []

[project.urls]
Homepage = "https://github.com/drewster99/drews-xcode-mcp"
Repository = "https://github.com/drewster99/drews-xcode-mcp"
Issues = "https://github.com/drewster99/drews-xcode-mcp/issues"
